name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS and JS
        run: npm run build

      - name: Cache-bust asset URLs
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          find . -name '*.html' -not -path './node_modules/*' -print0 \
            | xargs -0 sed -i -E "s#(assets/(css|js|vendor)/[A-Za-z0-9._-]+\.(css|js))#\1?v=${SHORT_SHA}#g"
          # Zbudowane bundle tez odwoluja sie do zasobow (avif.min.js i heic.min.js
          # tworza workera z /assets/js/image-worker.min.js). Bez tego kroku worker
          # bylby jedynym plikiem bez wersji w URL - przegladarka pobralaby nowy bundle,
          # ale zostala przy starym workerze z cache.
          find assets/js -name '*.min.js' -print0 \
            | xargs -0 sed -i -E "s#(assets/(css|js|vendor)/[A-Za-z0-9._-]+\.(css|js))#\1?v=${SHORT_SHA}#g"
          echo "Ostemplowano URL-e zasobow wersja ${SHORT_SHA}"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          rsync -avz --delete --stats \
            -e "ssh -o StrictHostKeyChecking=yes" \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --chmod=D775,F664 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.gitignore' \
            --exclude='.cache/' \
            --exclude='node_modules/' \
            --exclude='assets/scss/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='stats/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='LICENSE' \
            --exclude='nginx.conf' \
            --exclude='*.log' \
            --exclude='articles/*/article-draft.md' \
            --exclude='api/' \
            --exclude='redesign/' \
            ./ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
